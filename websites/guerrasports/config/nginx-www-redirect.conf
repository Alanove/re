# ─────────────────────────────────────────────────────────────────────────────
# www.guerrasports.com — Redirect-only nginx config
# aaPanel site: www.guerrasports.com (add as a separate site in aaPanel)
# Server path: /www/server/panel/vhost/nginx/www.guerrasports.com.conf
#
# Redirects http://www.guerrasports.com AND https://www.guerrasports.com
# to https://guerrasports.com (301 permanent).
#
# IMPORTANT: SSL cert is required here too. The browser completes the TLS
# handshake before it can follow the redirect, so without the cert you'd get
# a cert error instead of a redirect on the https://www variant.
#
# Cloudflare will cache this 301, so repeat visitors get redirected at the
# CDN edge without hitting the server at all.
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name www.guerrasports.com;

    ssl_certificate     /www/server/panel/vhost/cert/guerrasports/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/guerrasports/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Redirect ALL www traffic → canonical non-www domain
    return 301 https://guerrasports.com$request_uri;
}
