# ─────────────────────────────────────────────────────────────────────────────
# guerrasports.com — Main site nginx config
# aaPanel site: guerrasports.com
# Server path: /www/server/panel/vhost/nginx/guerrasports.com.conf
#
# Handles guerrasports.com → proxies to Node.js on port 3007
# www redirect is handled by a SEPARATE site/config (see nginx-www-redirect.conf)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    listen 443 ssl http2;
    server_name guerrasports.com;

    index index.html index.htm default.htm default.html;
    # root /www/wwwroot/guerrasports/;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/guerrasports.conf;
    #CERT-APPLY-CHECK--END

    ssl_certificate     /www/server/panel/vhost/cert/guerrasports/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/guerrasports/privkey.pem;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";
    error_page 497 https://$host$request_uri;

    # Redirect plain http → https
    # Use X-Forwarded-Proto (set by Cloudflare) instead of $scheme to avoid infinite redirect loops.
    # Cloudflare always connects to nginx via HTTP but sets X-Forwarded-Proto: https for HTTPS clients.
    # The $http_x_forwarded_proto variable is empty when Cloudflare is not in front (direct hit),
    # in which case we fall back to $scheme.
    set $real_scheme $scheme;
    if ($http_x_forwarded_proto != "") {
        set $real_scheme $http_x_forwarded_proto;
    }
    if ($real_scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Deny access to sensitive files
    location ~ ^/(\.user.ini|\.htaccess|\.git|\.svn|\.project|LICENSE|README.md|package.json|package-lock.json|\.env|node_modules) {
        return 404;
    }

    # SSL certificate verification directory
    location /.well-known/ {
        root /www/wwwroot/guerrasports/;
    }

    # Cache purge
    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $host$request_uri$is_args$args;
    }

    # Proxy to Node.js
    location / {
        proxy_pass http://127.0.0.1:3007;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header REMOTE-HOST       $remote_addr;
        proxy_connect_timeout 30s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    30s;
        proxy_http_version    1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/node_guerrasports.conf;
    #REWRITE-END

    access_log /www/wwwlogs/guerrasports.log;
    error_log  /www/wwwlogs/guerrasports.error.log;
}
